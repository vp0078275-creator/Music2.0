name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Project
        run: unzip music.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: Music 2.0

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug
        working-directory: Music 2.0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: Music 2.0/app/build/outputs/apk/debug/app-debug.apk
          
